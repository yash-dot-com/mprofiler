services:
  - type: web
    name: mprofiler-worker
    runtime: node
    region: singapore
    plan: free
    buildCommand: yarn install --immutable && yarn workspace @se-2/hardhat compile
    startCommand: yarn workspace @se-2/hardhat worker
    envVars:
      - key: NODE_VERSION
        value: 20.18.3
      - key: MPROFILER_WORKER_HOST
        value: 0.0.0.0
      - key: MPROFILER_WORKER_TOKEN
        sync: false
